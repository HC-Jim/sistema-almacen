<div class="pagina-titulo">
  <div>
    <h1>Menú principal</h1>
    <p class="subtitulo">Bienvenido, {{ auth.sesion()?.nombre }}</p>
  </div>
</div>

<section class="opciones-menu">
  @for (m of modulos(); track m.id) {
    <a class="opcion" [routerLink]="['/', m.id]">
      <strong>{{ m.titulo }}</strong>
      <span class="muted">{{ m.detalle }}</span>
    </a>
  }
</section>
