<div class="pagina-titulo">
  <div>
    <h1>Cambiar contraseña</h1>
    <p class="subtitulo">Usuario: {{ auth.sesion()?.username }}. La nueva contraseña debe tener al menos 8 caracteres.</p>
  </div>
</div>

@if (error()) {
  <p class="alerta">{{ error() }}</p>
}
@if (exito()) {
  <p class="exito">{{ exito() }}</p>
}

<section class="tarjeta">
  <form [formGroup]="form" (ngSubmit)="guardar()">
    <div class="form-grid">
      <label class="ancho-total">
        Contraseña actual
        <input type="password" formControlName="actual" autocomplete="current-password" />
        @if (form.controls.actual.touched && form.controls.actual.invalid) {
          <small class="invalido">Ingrese su contraseña actual.</small>
        }
      </label>

      <label>
        Nueva contraseña
        <input type="password" formControlName="nueva" autocomplete="new-password" maxlength="72" />
        @if (form.controls.nueva.touched && form.controls.nueva.invalid) {
          <small class="invalido">Mínimo 8 caracteres.</small>
        }
      </label>

      <label>
        Confirmar nueva contraseña
        <input type="password" formControlName="confirmar" autocomplete="new-password" maxlength="72" />
        @if (form.controls.confirmar.touched && form.hasError('noCoinciden')) {
          <small class="invalido">Las contraseñas no coinciden.</small>
        }
      </label>
    </div>

    <div class="acciones">
      <button type="submit" class="btn" [disabled]="guardando()">
        {{ guardando() ? 'Guardando…' : 'Cambiar contraseña' }}
      </button>
    </div>
  </form>
</section>
