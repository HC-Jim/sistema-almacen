<div class="fondo">
  <form class="caja" [formGroup]="form" (ngSubmit)="ingresar()">
    <h1>SISTEMA DE ALMACÉN</h1>
    <p class="muted">Ingrese sus credenciales</p>

    @if (error()) {
      <p class="alerta">{{ error() }}</p>
    }

    <label>
      Usuario
      <input formControlName="username" autocomplete="username" autofocus />
    </label>

    <label>
      Contraseña
      <input type="password" formControlName="password" autocomplete="current-password" />
    </label>

    <button type="submit" class="btn" [disabled]="cargando()">
      {{ cargando() ? 'Ingresando…' : 'Ingresar' }}
    </button>
  </form>
</div>
