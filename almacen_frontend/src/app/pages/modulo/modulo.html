<div class="pagina-titulo">
  <div>
    <h1>{{ datos().titulo }}</h1>
    <p class="subtitulo">{{ datos().detalle }}</p>
  </div>
</div>

<section class="opciones-menu">
  @for (o of opciones(); track o.ruta) {
    <!-- Texto y no arreglo: en un arreglo "ventas/nueva" sería un solo segmento ("ventas%2Fnueva") -->
    <a class="opcion" [routerLink]="'/' + datos().id + '/' + o.ruta">
      <strong>{{ o.titulo }}</strong>
      <span class="muted">{{ o.detalle }}</span>
    </a>
  }
</section>
