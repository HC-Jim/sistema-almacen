<header class="barra">
  <a routerLink="/" class="marca">SISTEMA DE ALMACÉN</a>
  <div class="usuario">
    <span>{{ auth.sesion()?.nombre }} ({{ auth.sesion()?.username }})</span>
    <a routerLink="/cambiar-password" class="btn btn-sec btn-chico">Cambiar contraseña</a>
    <button type="button" class="btn btn-sec btn-chico" (click)="auth.logout()">Cerrar sesión</button>
  </div>
</header>

<div class="cuerpo">
  <nav class="menu" aria-label="Menú principal">
    @for (grupo of menu(); track grupo.titulo) {
      <p class="grupo">{{ grupo.titulo }}</p>
      @for (enlace of grupo.enlaces; track enlace.ruta) {
        <a
          [routerLink]="enlace.ruta"
          routerLinkActive="activo"
          [routerLinkActiveOptions]="{ exact: enlace.exacto ?? false }"
          >{{ enlace.texto }}</a
        >
      }
    }
  </nav>

  <main class="contenido">
    <router-outlet />
  </main>
</div>
