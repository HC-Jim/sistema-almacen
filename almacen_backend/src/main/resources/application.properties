spring.application.name=almacen-backend
server.port=8080

# MySQL: la base se crea sola si no existe.
# La contraseña se lee de la variable de entorno DB_PASSWORD (no la escribas aquí).
spring.datasource.url=jdbc:mysql://localhost:3306/almacen_db?createDatabaseIfNotExist=true&serverTimezone=America/Lima
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Origen permitido para el frontend Angular (CORS)
app.cors.allowed-origins=http://localhost:4200

# Login (JWT). Para producción define JWT_SECRET con una clave larga y aleatoria.
app.jwt.secret=${JWT_SECRET:clave-de-desarrollo-almacen-cambiar-en-produccion-2026}
app.jwt.horas=8

# Usuario administrador que se crea la primera vez que arranca el sistema.
app.admin.username=admin
app.admin.password=${ADMIN_PASSWORD:admin123}
